  .stats-row { max-width: 1100px; margin: 0 auto 32px; display: flex; gap: 16px; flex-wrap: wrap; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 24px; flex: 1; min-width: 160px; }
  .stat-card .label { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .stat-card .value { font-family: 'IBM Plex Mono', monospace; font-size: 2rem; font-weight: 600; color: var(--accent); }
  .controls { max-width: 1100px; margin: 0 auto 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .search-wrap { flex: 1; min-width: 220px; position: relative; }
  .search-wrap input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; padding: 10px 14px 10px 38px; outline: none; transition: border-color 0.2s; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap::before { content: "⌕"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 1rem; pointer-events: none; }
  .btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; padding: 10px 16px; cursor: pointer; transition: background 0.2s, border-color 0.2s; white-space: nowrap; }
  .btn:hover { background: var(--hover); border-color: var(--accent); }
  .btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.accent:hover { opacity: 0.85; }
  .table-wrap { max-width: 1100px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: var(--surface2); border-bottom: 2px solid var(--border); }
  th { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 14px 20px; text-align: left; font-weight: 500; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--hover); }
  td { padding: 14px 20px; font-size: 0.875rem; vertical-align: middle; }
  .ref-badge { display: inline-block; background: var(--tag-bg); color: var(--tag-text); border: 1px solid rgba(79,142,247,0.25); border-radius: 4px; padding: 3px 8px; font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; font-weight: 600; }
  td.url { font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; max-width: 480px; word-break: break-all; }
  td.url a { color: var(--accent2); text-decoration: none; transition: color 0.15s; }
  td.url a:hover { color: var(--accent); text-decoration: underline; }
  .count-bar { max-width: 1100px; margin: 0 auto 12px; display: flex; justify-content: flex-end; }
  .count-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--muted); }
  #rowCount { color: var(--accent); font-weight: 600; }
  .no-results { text-align: center; padding: 60px 20px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

function buildTable(rows) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  rows.forEach(([ref, url]) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><span class="ref-badge">${ref}</span></td><td class="url"><a href="${url}" target="_blank" rel="noopener">${url}</a></td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('visibleCount').textContent = rows.length;
  document.getElementById('rowCount').textContent = rows.length;
}

function filterTable() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered = q ? data.filter(([r,u]) => r.toLowerCase().includes(q) || u.toLowerCase().includes(q)) : data;
  buildTable(filtered);
  document.getElementById('noResults').style.display = filtered.length === 0 ? 'block' : 'none';
  document.getElementById('linkTable').style.display = filtered.length === 0 ? 'none' : 'table';
}

function resetTable() {
  document.getElementById('searchInput').value = '';
  buildTable(data);
  document.getElementById('noResults').style.display = 'none';
  document.getElementById('linkTable').style.display = 'table';
}

function copyCSV() {
  const csv = 'Reference,URL\n' + data.map(([r,u]) => `${r},${u}`).join('\n');
  navigator.clipboard.writeText(csv).then(() => {
    const el = document.getElementById('copySuccess');
    el.style.display = 'inline';
    setTimeout(() => el.style.display = 'none', 2000);
  });
}

document.getElementById('totalCount').textContent = data.length;
buildTable(data);
