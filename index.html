<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAMIRINSIDE Archive (2024-2026)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .tweet-card:hover { transform: translateY(-2px); transition: all 0.2s ease; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .accent-gradient { background: linear-gradient(135deg, #0f172a 0%, #334155 100%); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 pb-12">

    <header class="accent-gradient text-white pt-16 pb-24 px-6 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="w-full h-full fill-current"><path d="M0 100 L100 0 L100 100 Z"></path></svg>
        </div>
        <div class="max-w-6xl mx-auto relative z-10 flex flex-col md:flex-row justify-between items-end gap-6">
            <div class="space-y-2">
                <div class="flex items-center gap-3 mb-2">
                    <span class="bg-blue-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-tighter">Verified Archive</span>
                    <span class="text-blue-200 text-xs font-medium">Updated: April 2026</span>
                </div>
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">PAMIRINSIDE Archive</h1>
                <p class="text-slate-300 text-lg max-w-2xl">Historical Repository of Tweets and Retweets covering GBAO developments, human rights, and regional news (2024-2026).</p>
            </div>
            <div class="bg-white/10 backdrop-blur-md rounded-2xl p-6 border border-white/20 text-center min-w-[160px]">
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">Total Records</p>
                <div id="statsCount" class="text-4xl font-black text-white">0</div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 -mt-12 relative z-20">
        <div class="glass border border-slate-200 rounded-3xl shadow-2xl p-4 md:p-6 mb-8">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="relative flex-grow">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="searchInput" placeholder="Search events, names, or accounts (e.g. 'Chorshanbiev', 'Amnesty')..." 
                        class="block w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-600 outline-none transition-all text-lg font-medium">
                </div>
                <div class="flex gap-2">
                    <button onclick="resetFilters()" class="px-6 py-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition-all active:scale-95">Reset</button>
                    <button onclick="exportCSV()" class="px-8 py-4 bg-blue-600 rounded-2xl text-sm font-bold text-white hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition-all active:scale-95 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        Copy Data
                    </button>
                </div>
            </div>
        </div>

        <div id="resultsContainer" class="grid grid-cols-1 gap-4">
            <!-- Items injected by JS -->
        </div>

        <div id="noResults" class="hidden py-32 text-center">
            <div class="w-24 h-24 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-6 text-slate-300">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h3 class="text-2xl font-bold text-slate-800">No matches found</h3>
            <p class="text-slate-500 mt-2">Try adjusting your search terms or keywords.</p>
        </div>
    </main>

    <script>
        const tweetData = [
            { date: "Apr 1, 2026", source: "@pamirinside", content: "❗️ Convicted activist Khushruz Jumayev reports on deteriorating health and need for surgery", url: "https://twitter.com/i/web/status/2039258978547359852", type: "RT" },
            { date: "Apr 1, 2026", source: "@pamirinside", content: "❗️ New developments in the Chorshanbiev case: what is known about the situation at the prison", url: "https://twitter.com/i/web/status/2039258870111949162", type: "RT" },
            { date: "Mar 27, 2026", source: "@pamirinside", content: "❗️ Why did the GBAO authorities suddenly start ‘speaking like lawmakers’—and what’s behind it?", url: "https://twitter.com/i/web/status/2037460776542183895", type: "RT" },
            { date: "Dec 23, 2025", source: "@pamirinside", content: "⚠️ ‘Inexpressible Events’: Anthropologist Fiona Naim on the Pamirs, Repression, and Memory", url: "https://twitter.com/i/web/status/2003601297510138260", type: "RT" },
            { date: "Nov 30, 2025", source: "@asmapamir", content: "According to sources, Karamkhudoev was scheduled to be released in early 2026", url: "https://twitter.com/i/web/status/1995166088703725818", type: "RT" },
            { date: "Nov 26, 2025", source: "@pamirinside", content: "Pursuing Accountability for Crimes against Humanity in Tajikistan", url: "https://twitter.com/i/web/status/1993728561803559062", type: "RT" },
            { date: "Nov 26, 2025", source: "@pamirinside", content: "Four years of repression in GBAO: Lessons from history", url: "https://twitter.com/i/web/status/1993727984474407197", type: "RT" },
            { date: "Nov 5, 2025", source: "@pamirinside", content: "Human Rights Watch called on the Central Asia-US summit", url: "https://twitter.com/i/web/status/1985993166101627027", type: "RT" },
            { date: "Nov 3, 2025", source: "@pamirinside", content: "Tajik Foreign Ministry expressed concern over EU sanctions", url: "https://twitter.com/i/web/status/1985426289985990809", type: "RT" },
            { date: "Oct 13, 2025", source: "@pamirinside", content: "Congratulations to all Ismailis on the Imam’s birthday", url: "https://twitter.com/i/web/status/1977639761750983126", type: "RT" },
            { date: "Sep 4, 2025", source: "@pamirinside", content: "Investigate the deaths of five Pamiri detainees", url: "https://twitter.com/i/web/status/1963506557011792269", type: "RT" },
            { date: "Aug 25, 2025", source: "@pamirinside", content: "Another Pamir prisoner died in Khujand colony", url: "https://twitter.com/i/web/status/1959998811239330047", type: "RT" },
            { date: "Aug 22, 2025", source: "@pamirinside", content: "National Alliance supported human rights statement", url: "https://twitter.com/i/web/status/1958900583420551314", type: "RT" },
            { date: "Jul 13, 2025", source: "@pamirinside", content: "Athletes from GBAO banned from Ismaili Games", url: "https://twitter.com/i/web/status/1944327678833590305", type: "RT" },
            { date: "Jul 7, 2025", source: "@pamirinside", content: "Families pressured to return under amnesty promises", url: "https://twitter.com/i/web/status/1942148995981189437", type: "RT" },
            { date: "Jun 27, 2025", source: "@pamirinside", content: "Muzaffar Davlatmirov died in prison", url: "https://twitter.com/i/web/status/1938547894417526966", type: "RT" },
            { date: "Jun 27, 2025", source: "@pamirinside", content: "Muzaffar Davlatmirov passed away", url: "https://twitter.com/i/web/status/1938547857092456647", type: "RT" },
            { date: "May 16, 2025", source: "@pamirinside", content: "3 years since repression began in GBAO", url: "https://twitter.com/i/web/status/1923260500017635482", type: "RT" },
            { date: "Apr 30, 2025", source: "@pamirinside", content: "Amnesty International review of Tajikistan", url: "https://twitter.com/i/web/status/1917637769695838475", type: "RT" },
            { date: "Apr 28, 2025", source: "@pamirinside", content: "Ismaili Center statement in Dushanbe", url: "https://twitter.com/i/web/status/1916887089800454209", type: "RT" },
            { date: "Apr 12, 2025", source: "@pamirinside", content: "Forced war participation case", url: "https://twitter.com/i/web/status/1911005976414535924", type: "RT" },
            { date: "Feb 2, 2025", source: "@pamirinside", content: "Germany deportation statistics", url: "https://twitter.com/i/web/status/1885961160186298584", type: "RT" },
            { date: "Nov 22, 2024", source: "@pamirinside", content: "Photo of Manucher Kholiknazarov", url: "https://twitter.com/i/web/status/1860058213389152294", type: "RT" },
            { date: "Nov 16, 2024", source: "@pamirinside", content: "Chorshanbiev received 4-year sentence", url: "https://twitter.com/i/web/status/1857699030349812002", type: "RT" },
            { date: "Nov 11, 2024", source: "@pamirinside", content: "Opposition activist deported from Germany", url: "https://twitter.com/i/web/status/1856041569994059867", type: "RT" },
            { date: "Sep 14, 2024", source: "@pamirinside", content: "Amnesty on discrimination against Pamiris", url: "https://twitter.com/i/web/status/1834897848778858652", type: "RT" },
            { date: "Aug 21, 2024", source: "@pamirinside", content: "Russian sanctions including Aga Khan Foundation", url: "https://twitter.com/i/web/status/1826221496617886124", type: "RT" },
            { date: "Aug 10, 2024", source: "@pamirinside", content: "Case opened in Dushanbe", url: "https://twitter.com/i/web/status/1822209915496071333", type: "RT" },
            { date: "Jul 24, 2024", source: "@pamirinside", content: "12 years since Badakhshan tragic events", url: "https://twitter.com/i/web/status/1816024007549870472", type: "RT" }
        ];

        function renderItems(items) {
            const container = document.getElementById('resultsContainer');
            const stats = document.getElementById('statsCount');
            const noRes = document.getElementById('noResults');

            stats.innerText = items.length;

            if (items.length === 0) {
                container.innerHTML = '';
                noRes.classList.remove('hidden');
                return;
            }

            noRes.classList.add('hidden');
            container.innerHTML = items.map(item => `
                <div class="tweet-card bg-white border border-slate-200 rounded-2xl p-5 md:p-6 shadow-sm hover:shadow-xl hover:border-blue-200 transition-all flex flex-col md:flex-row gap-6">
                    <div class="flex-shrink-0 flex flex-col items-center justify-center min-w-[100px] border-b md:border-b-0 md:border-r border-slate-100 pb-4 md:pb-0 md:pr-6">
                        <span class="text-xs font-black text-slate-400 uppercase tracking-widest">${item.date.split(',')[1] || ''}</span>
                        <span class="text-lg font-bold text-slate-800">${item.date.split(',')[0]}</span>
                    </div>
                    <div class="flex-grow space-y-3">
                        <div class="flex items-center gap-2">
                            <span class="bg-slate-100 text-slate-600 px-2 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider">${item.type}</span>
                            <span class="text-blue-600 font-bold text-sm tracking-tight">${item.source}</span>
                        </div>
                        <p class="text-slate-700 text-lg leading-relaxed font-medium">
                            ${item.content}
                        </p>
                        <div class="pt-2 flex items-center justify-between">
                            <a href="${item.url}" target="_blank" class="text-blue-500 hover:text-blue-700 font-bold text-xs flex items-center gap-2 group">
                                VIEW ORIGINAL TWEET
                                <svg class="w-3 h-3 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = tweetData.filter(i => 
                i.content.toLowerCase().includes(term) || 
                i.source.toLowerCase().includes(term) || 
                i.date.toLowerCase().includes(term)
            );
            renderItems(filtered);
        });

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            renderItems(tweetData);
        }

        function exportCSV() {
            const text = tweetData.map(i => `${i.date}, ${i.source}, "${i.content}", ${i.url}`).join('\n');
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            const btn = document.querySelector('button[onclick="exportCSV()"]');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = "Copied to Clipboard!";
            btn.classList.replace('bg-blue-600', 'bg-emerald-600');
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.replace('bg-emerald-600', 'bg-blue-600');
            }, 2500);
        }

        window.onload = () => renderItems(tweetData);
    </script>
</body>
</html>
