let filtered = [...DATA];

const tbody = document.getElementById('tableBody');
const noResults = document.getElementById('noResults');
const visibleCount = document.getElementById('visibleCount');
const deactivatedCount = document.getElementById('deactivatedCount');
const resultsInfo = document.getElementById('resultsInfo');
const footerCount = document.getElementById('footerCount');

function isDeactivated(s) {
  return s.toLowerCase().includes('deactivated');
}

function render(data) {
  tbody.innerHTML = '';
  if (data.length === 0) {
    noResults.style.display = 'block';
  } else {
    noResults.style.display = 'none';
    data.forEach(([ref, url, status]) => {
      const deact = isDeactivated(status);
      const tr = document.createElement('tr');
      if (deact) tr.classList.add('deactivated-row');
      tr.innerHTML = `
        <td><span class="ref">${ref}</span></td>
        <td class="url-cell"><a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a></td>
        <td><span class="status ${deact ? 'deactivated' : 'no-notes'}">${deact ? 'Voluntarily Deactivated' : 'No notes'}</span></td>`;
      tbody.appendChild(tr);
    });
  }
  visibleCount.textContent = data.length;
  const dCount = data.filter(([,,s]) => isDeactivated(s)).length;
  deactivatedCount.textContent = dCount;
  resultsInfo.textContent = `Showing ${data.length} of ${DATA.length} entries`;
  footerCount.textContent = `${data.length} entries shown`;
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const sf = document.getElementById('statusFilter').value;
  filtered = DATA.filter(([ref, url, status]) => {
    const matchQ = !q || ref.toLowerCase().includes(q) || url.toLowerCase().includes(q) || status.toLowerCase().includes(q);
    const matchS = !sf ||
      (sf === 'deactivated' && isDeactivated(status)) ||
      (sf === 'no-notes' && !isDeactivated(status));
    return matchQ && matchS;
  });
  render(filtered);
}

function resetAll() {
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = '';
  filtered = [...DATA];
  render(filtered);
}

function copyCSV() {
  const header = 'Reference,URL,Status\n';
  const rows = filtered.map(([r,u,s]) => `${r},"${u}","${s}"`).join('\n');
  navigator.clipboard.writeText(header + rows).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  });
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('statusFilter').addEventListener('change', applyFilters);

render(DATA);
